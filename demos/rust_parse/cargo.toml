[package]
name = "dokist-parse"
version = "0.1.0"
edition = "2021"
authors = ["DOKIST Engineering <eng@dokist.ai>"]
description = "Memory-safe PDF text extraction with bilingual normalization for DOKIST"
license = "MIT"
repository = "https://github.com/Dokist-ai/core"

[lib]
name = "_dokist_parse"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
unicode-normalization = "0.1"
regex = "1.10"

# Optional: enable 'pdf' feature for real lopdf parsing.
# For the reference build we ship a deterministic demo parser
# so the crate compiles without system dependencies.
lopdf = { version = "0.34", optional = true }

[features]
default = []
pdf = ["lopdf"]

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1
