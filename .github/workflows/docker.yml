name: Build and Push Docker Images

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  detect-services:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.set-services.outputs.services }}
    steps:
      - uses: actions/checkout@v4
      - id: set-services
        run: |
          SERVICES="[]"
          for dir in legal-intelligence-engine research-briefing-agent due-diligence-agent; do
            if [ -f "$dir/Dockerfile" ]; then
              SERVICES=$(echo "$SERVICES" | jq --arg d "$dir" --arg n "$(basename $dir)" '. + [{"context": $d, "name": $n}]')
            fi
          done
          echo "services=$SERVICES" >> $GITHUB_OUTPUT

  build:
    needs: detect-services
    if: ${{ needs.detect-services.outputs.services != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-services.outputs.services) }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service.name }}
      - uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service.context }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
